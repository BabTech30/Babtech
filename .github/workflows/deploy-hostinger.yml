# Site pour Hostinger, construit par GitHub à chaque mise à jour de la branche main.
#
# Sans aucune configuration : le site est construit, contrôlé, et le fichier « site-hostinger »
# (zip, .htaccess compris) est téléchargeable dans l'onglet Actions → dernière exécution → Artifacts.
# Il suffit de l'importer dans public_html via le gestionnaire de fichiers d'Hostinger et de l'extraire.
#
# Envoi automatique (facultatif) : ajouter dans GitHub → Settings → Secrets and variables → Actions
# les secrets FTP_SERVER, FTP_USERNAME et FTP_PASSWORD (hPanel → Fichiers → Comptes FTP).
# Détails : docs/DEPLOIEMENT.md

name: Site Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire et contrôler le site
        run: npm run build && npm run check
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Variables facultatives du dépôt (Settings → Secrets and variables → Actions → Variables)
          NEXT_PUBLIC_PHONE: ${{ vars.PHONE }}
          NEXT_PUBLIC_FORMSPREE_COMMUNITY_ID: ${{ vars.FORMSPREE_COMMUNITY_ID }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          NEXT_PUBLIC_CLIENT_SPACE_URL: ${{ vars.CLIENT_SPACE_URL }}

      - name: Fichier à importer dans Hostinger
        uses: actions/upload-artifact@v7
        with:
          name: site-hostinger
          path: out/
          include-hidden-files: true
          retention-days: 30

      - name: Envoi automatique sur Hostinger (si les accès FTP sont configurés)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
