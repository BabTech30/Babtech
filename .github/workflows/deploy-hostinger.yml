# Déploiement automatique sur Hostinger à chaque mise à jour de la branche main.
#
# Désactivé tant que la variable HOSTINGER_DEPLOY ne vaut pas "true".
# Configuration (GitHub → Settings → Secrets and variables → Actions) :
#   Secrets   : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (hPanel → Fichiers → Comptes FTP)
#   Variables : HOSTINGER_DEPLOY=true, SITE_URL=https://babtech.fr
#               facultatives : PHONE, FTP_SERVER_DIR (défaut public_html/), FTP_PROTOCOL (défaut ftps),
#               FORMSPREE_COMMUNITY_ID, PLAUSIBLE_DOMAIN, UMAMI_WEBSITE_ID,
#               GOOGLE_SITE_VERIFICATION, BING_SITE_VERIFICATION, CLIENT_SPACE_URL
# Détails : docs/DEPLOIEMENT.md

name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.HOSTINGER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Vérifier la configuration
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Variable SITE_URL manquante (ex. https://babtech.fr)"
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire et contrôler le site
        run: npm run build && npm run check
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_PHONE: ${{ vars.PHONE }}
          NEXT_PUBLIC_FORMSPREE_COMMUNITY_ID: ${{ vars.FORMSPREE_COMMUNITY_ID }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          NEXT_PUBLIC_CLIENT_SPACE_URL: ${{ vars.CLIENT_SPACE_URL }}

      - name: Envoyer sur Hostinger
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
